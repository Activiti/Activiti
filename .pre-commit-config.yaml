repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-xml
        exclude: ^.*parsing-error\.bpmn20\.xml$
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
      - id: trailing-whitespace
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4 # frozen: v3.1.0
    hooks:
      - id: prettier
        types_or:
          - java
          - markdown
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
        additional_dependencies:
          - prettier@3.9.6
          - prettier-plugin-java@2.10.3
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
        exclude: ^\.github/workflows/.*\.lock\.yml$
  - repo: https://github.com/returntocorp/semgrep
    rev: 951f47a5aa64646f3634671517902fe52d7c3d8f # frozen: v1.31.2
    hooks:
      - id: semgrep
        types_or:
          - java
          - xml
        args: ["--config", ".semgrep.yaml", "--error", "--metrics=off"]
