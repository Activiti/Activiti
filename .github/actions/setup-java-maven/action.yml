name: Setup Java and Maven cache
description: Restores the Maven ~/.m2 cache, sets up the JDK and installs the requested Maven version.

inputs:
  maven-version:
    description: The Maven version to set up.
    required: true
  java-version:
    description: The Java version to set up.
    required: false
    default: "25"
  java-distribution:
    description: The Java distribution to set up.
    required: false
    default: "corretto"

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java JDK ${{ inputs.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # 6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}

    - name: Setup Maven ${{ inputs.maven-version }}
      uses: Alfresco/alfresco-build-tools/.github/actions/setup-maven@f2ba011b2bd8bee8d7418b046541ce2f75d1fbed # v19.4.0
      with:
        version: ${{ inputs.maven-version }}
