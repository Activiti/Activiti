name: Setup Java and Maven cache
description: >-
  Restores the Maven ~/.m2 cache, sets up the JDK, installs the requested Maven
  version and configures Maven to resolve all artifacts through Cloudsmith.
  The job must have the `id-token: write` permission. Fork pull requests get no
  OIDC token, so they skip Cloudsmith and resolve from the POM repositories.

inputs:
  maven-version:
    description: The Maven version to set up.
    required: true
  cloudsmith-namespace:
    description: The Cloudsmith organisation namespace.
    required: true
  java-version:
    description: The Java version to set up.
    required: false
    default: "25"
  java-distribution:
    description: The Java distribution to set up.
    required: false
    default: "corretto"

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java JDK ${{ inputs.java-version }}
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # 6.3.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}

    - name: Setup Maven ${{ inputs.maven-version }}
      uses: Alfresco/alfresco-build-tools/.github/actions/setup-maven@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      with:
        version: ${{ inputs.maven-version }}

    - name: Authenticate with Cloudsmith
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      with:
        oidc-namespace: ${{ inputs.cloudsmith-namespace }}
        verify-auth: "true"

    - name: Use the Cloudsmith Maven settings
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      run: |
        mkdir -p ~/.m2
        cp settings.xml ~/.m2/settings.xml
