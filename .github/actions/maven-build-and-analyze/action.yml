name: Maven build and analyze
description: >-
  Builds and tests the project with Maven, aggregates JaCoCo coverage and runs
  the SonarCloud analysis. Java must be set up before calling this action.

inputs:
  nexus-username:
    description: Nexus username for Maven.
    required: true
  nexus-password:
    description: Nexus password for Maven.
    required: true
  sonar-token:
    description: SonarCloud token. When empty, the analysis is skipped.
    required: false
    default: ""
  maven-threads:
    description: Number of Maven reactor threads used for the build.
    required: false
    default: "1"
  maven-profiles:
    description: Comma-separated Maven profiles to activate for the build.
    required: false
    default: ""
  skip-tests:
    description: Skip test execution when tests have already run in separate jobs.
    required: false
    default: "false"
  test-results-artifacts:
    description: Artifact pattern containing all test shard results.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Test CI result helpers
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/ci-helper-venv"
        helper_python="$RUNNER_TEMP/ci-helper-venv/bin/python"
        "$helper_python" -m pip install --disable-pip-version-check --quiet -r tests/ci/requirements.txt
        "$helper_python" -m coverage run --branch --data-file="$RUNNER_TEMP/ci-helper-coverage" --source=.github/scripts -m unittest discover -s tests/ci
        mkdir -p target
        "$helper_python" -m coverage xml --data-file="$RUNNER_TEMP/ci-helper-coverage" -o target/ci-helper-coverage.xml

    - name: Build and Test with Maven
      shell: bash
      run: |
        args=(--batch-mode --threads "$MAVEN_THREADS" install)
        if [[ -n "$MAVEN_PROFILES" ]]; then
          args+=(--activate-profiles "$MAVEN_PROFILES")
        fi
        if [[ "$SKIP_TESTS" == "true" ]]; then
          args+=(-DskipTests -DskipITs)
        fi
        read -r -a cli_opts <<< "$MAVEN_CLI_OPTS"
        mvn "${args[@]}" "${cli_opts[@]}"
      env:
        MAVEN_THREADS: ${{ inputs.maven-threads }}
        MAVEN_PROFILES: ${{ inputs.maven-profiles }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
        MAVEN_USERNAME: ${{ inputs.nexus-username }}
        MAVEN_PASSWORD: ${{ inputs.nexus-password }}

    - name: Download test shard results
      if: ${{ inputs.test-results-artifacts != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.test-results-artifacts }}
        merge-multiple: true
        path: target/ci-test-results

    - name: Restore test reports and coverage
      if: ${{ inputs.test-results-artifacts != '' }}
      shell: bash
      run: python3 .github/scripts/ci_test_results.py restore

    - name: Merge JaCoCo execution files
      shell: bash
      run: mvn jacoco:merge@merge -N

    - name: Generate aggregate coverage report
      shell: bash
      run: mvn jacoco:report -Djacoco.dataFile=${{ github.workspace }}/target/jacoco.exec

    - name: Set SONAR_SCANNER_OPTS
      shell: bash
      run: |
        echo "SONAR_SCANNER_OPTS=sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=activiti -Dsonar.projectKey=Activiti_Activiti -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco*/jacoco.xml -Dsonar.python.coverage.reportPaths=${{ github.workspace }}/target/ci-helper-coverage.xml" >> $GITHUB_ENV

    - name: Run SonarCloud analysis
      if: ${{ inputs.sonar-token != '' }}
      shell: bash
      run: mvn ${{ env.SONAR_SCANNER_OPTS }} ${{ env.MAVEN_CLI_OPTS }}
      env:
        MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
        MAVEN_USERNAME: ${{ inputs.nexus-username }}
        MAVEN_PASSWORD: ${{ inputs.nexus-password }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}

    - name: Echo Longest Test Run
      uses: ./.github/actions/echo-longest-run
