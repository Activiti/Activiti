name: Maven build and analyze
description: >-
  Builds and tests the project with Maven, aggregates JaCoCo coverage and runs
  the SonarCloud analysis. Java must be set up before calling this action.

inputs:
  nexus-username:
    description: Nexus username for Maven.
    required: true
  nexus-password:
    description: Nexus password for Maven.
    required: true
  sonar-token:
    description: SonarCloud token. When empty, the analysis is skipped.
    required: false
    default: ""
  maven-threads:
    description: Number of Maven reactor threads used for the build.
    required: false
    default: "1"
  maven-profiles:
    description: Comma-separated Maven profiles to activate for the build.
    required: false
    default: ""
  skip-tests:
    description: Skip test execution when tests have already run in separate jobs.
    required: false
    default: "false"
  restore-test-results:
    description: Restore coverage and test reports from the three PR test groups.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build and Test with Maven
      shell: bash
      run: |
        args=(--batch-mode --threads "$MAVEN_THREADS" install)
        if [[ -n "$MAVEN_PROFILES" ]]; then
          args+=(--activate-profiles "$MAVEN_PROFILES")
        fi
        if [[ "$SKIP_TESTS" == "true" ]]; then
          args+=(-DskipTests -DskipITs)
        fi
        read -r -a cli_opts <<< "$MAVEN_CLI_OPTS"
        mvn "${args[@]}" "${cli_opts[@]}"
      env:
        MAVEN_THREADS: ${{ inputs.maven-threads }}
        MAVEN_PROFILES: ${{ inputs.maven-profiles }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
        MAVEN_USERNAME: ${{ inputs.nexus-username }}
        MAVEN_PASSWORD: ${{ inputs.nexus-password }}

    - name: Download test coverage
      if: ${{ inputs.restore-test-results == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-*
        path: target/ci-coverage

    - name: Download test reports
      if: ${{ inputs.restore-test-results == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-reports-*
        path: target/ci-test-reports

    - name: Validate and restore test results
      if: ${{ inputs.restore-test-results == 'true' }}
      shell: bash
      run: |
        for group in engine spring other; do
          coverage_directory="target/ci-coverage/coverage-$group"
          reports_directory="target/ci-test-reports/test-reports-$group"
          if [[ ! -d "$coverage_directory" || ! -d "$reports_directory" ]]; then
            echo "::error::Missing test artifacts for $group"
            exit 1
          fi
          if [[ -z "$(find "$coverage_directory" -type f -name '*.exec' -size +0c -print -quit)" ||
                -z "$(find "$reports_directory" -type f -name 'TEST-*.xml' -print -quit)" ]]; then
            echo "::error::Incomplete test artifacts for $group"
            exit 1
          fi
          while IFS= read -r -d '' report; do
            relative_report=${report#"$reports_directory/"}
            module=${relative_report%/target/*}
            if [[ ! -f "$module/pom.xml" || -e "$relative_report" ]]; then
              echo "::error::Unexpected or duplicate test report: $relative_report"
              exit 1
            fi
          done < <(find "$reports_directory" -type f -name 'TEST-*.xml' -print0)
          cp -R "$reports_directory/." .
        done
        rm -rf -- target/ci-test-reports

    - name: Merge JaCoCo execution files
      shell: bash
      run: mvn jacoco:merge@merge -N

    - name: Generate aggregate coverage report
      shell: bash
      run: mvn jacoco:report -Djacoco.dataFile=${{ github.workspace }}/target/jacoco.exec

    - name: Set SONAR_SCANNER_OPTS
      shell: bash
      run: |
        echo "SONAR_SCANNER_OPTS=sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=activiti -Dsonar.projectKey=Activiti_Activiti -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco*/jacoco.xml" >> $GITHUB_ENV

    - name: Run SonarCloud analysis
      if: ${{ inputs.sonar-token != '' }}
      shell: bash
      run: mvn ${{ env.SONAR_SCANNER_OPTS }} ${{ env.MAVEN_CLI_OPTS }}
      env:
        MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
        MAVEN_USERNAME: ${{ inputs.nexus-username }}
        MAVEN_PASSWORD: ${{ inputs.nexus-password }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}

    - name: Echo Longest Test Run
      uses: ./.github/actions/echo-longest-run
