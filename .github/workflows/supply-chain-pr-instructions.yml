name: Supply Chain Review - PR Instructions

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "pom.xml"
      - "**/pom.xml"

jobs:
  instructions:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/github-upsert-comment@f2ba011b2bd8bee8d7418b046541ce2f75d1fbed # v19.4.0
        with:
          comment-identifier: supply-chain-review-instructions
          comment-body: |
            ## 🔒 Supply Chain Security

            This PR modifies dependencies. To run a security analysis, comment:

            ```
            /supply-chain-review
            ```

            The analysis will check for vulnerabilities, typosquatting, maintainer takeovers, and other supply chain risks.
