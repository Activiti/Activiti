name: Label PR from branch

on:
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - develop

permissions: {}

jobs:
  label-from-branch:
    # Skip fork PRs with read-only tokens and Dependabot-sourced runs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.secret_source != 'Dependabot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label PR from branch name
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-label-from-branch@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          mapping: |
            feat/: enhancement
            feature/: enhancement
            improvement/: enhancement
            fix/: bug
            bug/: bug
            bugfix/: bug
            hotfix/: bug
            docs/: documentation
            documentation/: documentation
            deps/: dependencies
            dependencies/: dependencies
