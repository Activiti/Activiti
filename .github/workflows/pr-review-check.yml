name: "PR Review check"

env:
  TRIGGER_LABELS: '["CI", "preview", "skip-tests"]'
  DEPENDABOT_CREATOR: 'dependabot[bot]'
  MILESTONE_NAME: 'Validating'

on:
  pull_request_review:
    types:
      - submitted
  pull_request:
    branches:
      - develop
    types:
      - labeled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger validate on approval
        if: github.event_name == 'pull_request_review'
        uses: Alfresco/alfresco-build-tools/.github/actions/github-trigger-approved-pr@006d902af2f90a80e2dd99dede963115c8470b9f # temp version for testing
        with:
          creator: ${{ env.DEPENDABOT_CREATOR }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          milestone-on-approval: ${{ env.MILESTONE_NAME }}
          auto-merge-on-approval: true

      - name: Trigger validation on labeling
        if: github.event_name == 'pull_request'
        uses: Alfresco/alfresco-build-tools/.github/actions/github-trigger-labeled-pr@006d902af2f90a80e2dd99dede963115c8470b9f # temp version for testing
        with:
          labels: ${{ env.TRIGGER_LABELS }}
          milestone: ${{ env.MILESTONE_NAME }}
          force-trigger: true
