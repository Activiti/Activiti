name: "PR Review check"

env:
  TRIGGER_LABELS: '["CI", "preview", "skip-tests"]'
  MILESTONE_NAME: 'Validating'

on:
  pull_request_review:
    types:
      - submitted
  pull_request:
    branches:
      - develop
    types:
      - labeled

jobs:
  check:
    uses: Alfresco/alfresco-build-tools/.github/workflows/pr-review-check.yml@improvement/AAE-35226-dependabot-validation
    with:
      github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
      trigger-labels: ${{ env.TRIGGER_LABELS }}
      milestone-name: ${{ env.MILESTONE_NAME }}
