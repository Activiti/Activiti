name: "PR Review check"

env:
  TRIGGER_LABELS: '["CI", "preview", "skip-tests"]'
  DEPENDABOT_CREATOR: 'dependabot[bot]'
  MILESTONE_NAME: 'Validating'

on:
  pull_request_review:
    types:
      - submitted
  pull_request:
    branches:
      - develop
    types:
      - labeled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger validation on approval
        if: github.event_name == 'pull_request_review'
        uses: Alfresco/alfresco-build-tools/.github/actions/github-trigger-approved-pr@38ef6dee366288fd8a94d3aef54f151f660cc800 # temp version for testing
        with:
          creator: ${{ env.DEPENDABOT_CREATOR }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          milestone-on-approval: ${{ env.MILESTONE_NAME }}
          auto-merge-on-approval: true

      - name: Trigger validation on labeling
        if: github.event_name == 'pull_request' && github.event.action == 'labeled'
        uses: Alfresco/alfresco-build-tools/.github/actions/github-trigger-labeled-pr@38ef6dee366288fd8a94d3aef54f151f660cc800 # temp version for testing
        with:
          labels: ${{ env.TRIGGER_LABELS }}
          milestone: ${{ env.MILESTONE_NAME }}
          force-trigger: true
