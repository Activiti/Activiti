name: "Dependency Graph Submission of Transitive Dependencies"

on:
  push:
    branches: ["develop", "7.*.x"]

env:
  MAVEN_VERSION: "3.10.0"

jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-maven@v19.11.0
        with:
          version: ${{ env.MAVEN_VERSION }}
      - name: Submit Dependency Graph
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
