name: Cleanup on PR closed

on:
  pull_request_target:
    types:
      - closed

jobs:
  cleanup-gh-cache:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cleanup-preview-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close downstream preview PRs for this source PR only
        uses: Alfresco/alfresco-build-tools/.github/actions/github-close-orphaned-preview-prs@768b583839a22ef7d882da0c5b82af3832197d00 # 19.7.1
        with:
          source-pr-number: ${{ github.event.pull_request.number }}
          source-pr-state: ${{ github.event.pull_request.state }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
