name: PR - Validate and Build

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - milestoned

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  MAVEN_VERSION: "3.10.0"

jobs:
  check-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check dependabot/fork build
        if: github.secret_source == 'Dependabot' || (github.secret_source == 'None' && github.event.action != 'milestoned')
        uses: Alfresco/alfresco-build-tools/.github/actions/github-require-secrets@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          dependabot-error-message: "This PR requires additional validation, please set the milestone to 'Validating' or ask a reviewer to approve it."
          none-error-message: "This PR requires additional validation, please set the milestone to 'Validating'."

  pre-checks:
    runs-on: ubuntu-latest
    needs: check-access
    permissions:
      contents: read
    outputs:
      preview: ${{ steps.check_pr_preview.outputs.preview }}
    steps:
      - name: pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@7957efb76aba0eec7580a9c0392d3e5bec381359 # v2.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure all actions are covered by Dependabot
        uses: Alfresco/alfresco-build-tools/.github/actions/dependabot-missing-actions-check@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
      - name: Check PR preview
        id: check_pr_preview
        shell: bash
        run: |
          echo "preview=${{ contains(github.event.pull_request.labels.*.name, 'preview') }}" >> "$GITHUB_OUTPUT"

  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: check-access
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: engine
            profiles: ci-parallel-engine-tests
          - shard: spring
            profiles: ""
          - shard: other
            profiles: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Set preview version
        if: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION="0.0.1-PR-${PR_NUMBER}-SNAPSHOT"
          echo "$VERSION" > VERSION
          mvn -B versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build and test shard
        shell: bash
        run: |
          test_projects=()
          while IFS= read -r pom; do
            module=${pom%/pom.xml}
            case "$module" in
              ./activiti-core/activiti-engine) group=engine ;;
              */activiti-spring*) group=spring ;;
              *) group=other ;;
            esac
            if [[ "$group" == "$TEST_SHARD" ]]; then
              test_projects+=("$module")
            fi
          done < <(find . -name pom.xml -not -path '*/target/*' -not -path './.git/*' | sort)
          if [[ ${#test_projects[@]} -eq 0 ]]; then
            echo "::error::No Maven modules found for $TEST_SHARD"
            exit 1
          fi
          printf -v projects '%s,' "${test_projects[@]}"
          args=(--batch-mode --threads 2 --projects "${projects%,}" install)
          # Prepare only this group's modules and their upstream dependencies.
          mvn "${args[@]}" --also-make -DskipTests -DskipITs --show-version --no-transfer-progress --settings settings.xml
          if [[ -n "$MAVEN_PROFILES" ]]; then
            args+=(--activate-profiles "$MAVEN_PROFILES")
          fi
          mvn "${args[@]}" --show-version --no-transfer-progress --settings settings.xml
        env:
          TEST_SHARD: ${{ matrix.shard }}
          MAVEN_PROFILES: ${{ matrix.profiles }}
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Upload test coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: '**/target/*.exec'
          overwrite: true
          retention-days: 3
          if-no-files-found: error

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - tests
    # Keep the required build check red when a prerequisite fails.
    if: ${{ always() && !cancelled() }}
    permissions:
      actions: write
      contents: read
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Require successful checks and test shards
        if: ${{ needs.pre-checks.result != 'success' || needs.tests.result != 'success' }}
        run: |
          echo "Pre-checks and all test shards must pass before analysis."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history for blame and merge-base detection
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Set preview version
        if: ${{ needs.pre-checks.outputs.preview == 'true' }}
        run: |
          GITHUB_PR_NUMBER=PR-${{ github.event.pull_request.number }}
          echo "0.0.1-${GITHUB_PR_NUMBER}-SNAPSHOT" > VERSION

      - name: Set VERSION env variable
        id: version
        if: ${{ needs.pre-checks.outputs.preview == 'true' }}
        run: |
          VERSION=$(cat VERSION)
          echo "set VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update pom files to the new version
        if: ${{ needs.pre-checks.outputs.preview == 'true' }}
        run: mvn -B versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - uses: ./.github/actions/maven-build-and-analyze
        with:
          maven-threads: "2"
          restore-test-results: "true"
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - build
    if: ${{ needs.pre-checks.outputs.preview == 'true' && github.secret_source != 'None' && success() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Set preview version
        run: |
          GITHUB_PR_NUMBER=PR-${{ github.event.pull_request.number }}
          echo "0.0.1-${GITHUB_PR_NUMBER}-SNAPSHOT" > VERSION

      - name: Set VERSION env variable
        run: |
          VERSION=$(cat VERSION)
          echo "set VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update pom files to the new version
        run: mvn -B versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Deploy preview with Maven
        shell: bash
        run: mvn deploy -DskipTests -DskipITs ${{ env.MAVEN_CLI_OPTS}}
        env:
          MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  propagate-preview:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-propagation') && contains(github.event.pull_request.labels.*.name, 'preview') }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DEVELOPMENT_BRANCH: ${{ github.base_ref }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use preview updatebot config
        shell: bash
        run: cp .jx/updatebot-preview.yaml .jx/updatebot.yaml
      - uses: Alfresco/alfresco-build-tools/.github/actions/jx-updatebot-pr@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
        with:
          pull-request-title: "Preview snapshot PR: activiti ${{ env.VERSION }} from ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          version: ${{ env.VERSION }}
          auto-merge: 'false'
          labels: 'do-not-merge,preview-source-pr-${{ github.event.pull_request.number }}'
          base-branch-name: ${{ env.DEVELOPMENT_BRANCH }}
          git-username: ${{ vars.HXPS_GIT_USERNAME }}
          git-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-author-name: ${{ vars.HXPS_GIT_USERNAME }}
          git-author-email: ${{ vars.HXPS_GIT_EMAIL }}
          gpg-private-key: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_PRIVATE_KEY }}
          gpg-private-key-fingerprint: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_FINGERPRINT }}
          commit-message: "Preview snapshot PR: activiti ${{ env.VERSION }} from ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

      - name: Check source PR is still open
        id: source-pr-state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          STATE=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json state --jq .state)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Close preview PRs if source PR closed while propagating
        if: ${{ steps.source-pr-state.outputs.state != 'OPEN' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/github-close-orphaned-preview-prs@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          source-pr-number: ${{ github.event.pull_request.number }}
          source-pr-state: ${{ steps.source-pr-state.outputs.state }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
