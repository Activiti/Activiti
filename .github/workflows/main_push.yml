name: Push - Validate, Build and Release

on:
  push:
    branches:
      - develop

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  MAVEN_VERSION: "3.10.0"

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: read
    outputs:
      skip: ${{ steps.dependabot.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependabot check
        id: dependabot
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          actor: "dependabot[bot]"
          label: github_actions
      - name: pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          skip_checkout: true
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@7957efb76aba0eec7580a9c0392d3e5bec381359 # v2.0.1
      - name: Ensure all actions are covered by Dependabot
        uses: Alfresco/alfresco-build-tools/.github/actions/dependabot-missing-actions-check@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1

  create-tag:
    runs-on: ubuntu-latest
    needs: pre-checks
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    permissions:
      actions: write
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-tag@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        id: tag
        with:
          java-version: "25"
          maven-version: ${{ env.MAVEN_VERSION }}
          maven-username: ${{ secrets.NEXUS_USERNAME }}
          maven-password: ${{ secrets.NEXUS_PASSWORD }}
          git-username: ${{ secrets.BOT_GITHUB_USERNAME }}
          m2-cache-exclusion-pattern: org/activiti

  build:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - create-tag
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-tag.outputs.version }}
          # Sonar needs full history for blame and merge-base detection
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - uses: ./.github/actions/maven-build-and-analyze
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - create-tag
      - build
    if: ${{ success() }}
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-tag.outputs.version }}
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Check Cloudsmith namespace
        shell: bash
        env:
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
        run: |
          if [[ -z "$CLOUDSMITH_NAMESPACE" ]]; then
            echo "::error::Set the CLOUDSMITH_NAMESPACE GitHub Actions variable before publishing to Cloudsmith."
            exit 1
          fi

      - name: Deploy to Nexus
        shell: bash
        run: mvn deploy -DskipTests -DskipITs ${{ env.MAVEN_CLI_OPTS}}
        env:
          MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Authenticate with Cloudsmith
        uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
          verify-auth: "true"

      - name: Deploy to Cloudsmith
        shell: bash
        run: mvn --batch-mode deploy '-Pcloudsmith,!alfresco' -Daether.connector.basic.upstreamThreads.cloudsmith=10 -DskipTests -DskipITs ${{ env.MAVEN_CLI_OPTS}}
        env:
          # Override the runner's -ntp default so batch transfer timings are visible.
          MAVEN_ARGS: ""
          MAVEN_CLI_OPTS: --show-version --settings settings.xml
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}

  propagate:
    runs-on: ubuntu-latest
    needs:
      - create-tag
      - publish
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-tag.outputs.version }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Get branch name
        uses: Alfresco/alfresco-build-tools/.github/actions/get-branch-name@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1

      - name: Configure propagation git author
        if: ${{ env.BRANCH_NAME == 'develop' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          username: ${{ vars.HXPS_GIT_USERNAME }}
          email: ${{ vars.HXPS_GIT_EMAIL }}
          global: "true"

      - name: Propagate
        uses: Alfresco/alfresco-build-tools/.github/actions/jx-updatebot-pr@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        if: ${{ env.BRANCH_NAME == 'develop' }}
        env:
          DEVELOPMENT_BRANCH: ${{ github.ref_name }}
        with:
          version: ${{ needs.create-tag.outputs.version }}
          auto-merge: "true"
          labels: ${{ env.DEVELOPMENT_BRANCH }}
          base-branch-name: ${{ env.DEVELOPMENT_BRANCH }}
          git-username: ${{ vars.HXPS_GIT_USERNAME }}
          git-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-author-name: ${{ vars.HXPS_GIT_USERNAME }}
          git-author-email: ${{ vars.HXPS_GIT_EMAIL }}
          gpg-private-key: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_PRIVATE_KEY }}
          gpg-private-key-fingerprint: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_FINGERPRINT }}

  notify:
    runs-on: ubuntu-latest
    needs:
      - create-tag
      - build
      - publish
      - propagate
    if: always() && failure()
    permissions:
      contents: read
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          webhook-url: ${{ secrets.TEAMS_NOTIFICATION_WORKFLOW_WEBHOOK }}
